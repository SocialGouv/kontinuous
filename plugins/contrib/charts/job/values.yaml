enabled:
output: false
namespace: 
repository: 
gitBranch: 
runs: {}
defaults:
  image: "debian:stable"
  degitImage: ghcr.io/socialgouv/kontinuous/degit:v1.188.0
  # degitImagePullPolicy: Always
  degitImagePullPolicy: IfNotPresent

  # degitImage: harbor.fabrique.social.gouv.fr/sre/kontinuous/degit:v1
  priorityClassName: ""
  serviceAccountName: ""
  resources:
    limits:
      cpu: 
      memory: 
    requests:
      cpu: 
      memory: 
  degitRepository:
    resources:
      limits:
        cpu: 
        memory: 
      requests:
        cpu: 
        memory: 
  degitAction:
    resources:
      limits:
        cpu: 
        memory: 
      requests:
        cpu: 
        memory: 
  deployKey:
    enabled: false
    secretRefName: deploy-key
    secretRefKey: DEPLOY_KEY
  # Authenticates the degit checkouts against the forge. The forge throttles
  # anonymous access to the git endpoint degit uses to resolve a ref, so an
  # unauthenticated in-cluster checkout is rate-limited per egress IP.
  gitAuth:
    enabled: false
    secretRefName: git-auth
    secretRefKey: GIT_AUTH_TOKEN
    host: github.com
  kubeconfig:
    secretRefName: kubeconfig
    secretRefKey: KUBECONFIG
  mountDeployKey: false
_pluginValuesCompilerContribJob: true